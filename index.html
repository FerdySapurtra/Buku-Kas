<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c120f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Catatan keuangan pribadi: pemasukan, pengeluaran, tabungan, dan total aset. Data tersimpan di perangkatmu.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buku Kas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Buku Kas Saku</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: satu kolom (2 kolom di layar lebar) · kartu aset berlatar gradasi tema seperti sampul buku tabungan · dock kaca dengan tombol catat di tengah.
   Warna: permukaan netral kehijauan, satu warna tema (bisa diganti), dan warna data tetap: biru = pemasukan, oranye = pengeluaran, aqua = aset/tabungan. */
:root{
  --bg:#eef2ef; --surface:#fbfcfa; --surface2:#f1f5f2; --ink:#0e1a15; --ink2:#46534c; --mute:#66726c;
  --line:#e1e8e3; --axis:#c9d3cd;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --track3:#d6eee4; --track2:#fbe0d4; --track1:#d5e4f8;
  --pos:#006300; --warn:#fab219; --crit:#d03b3b; --serious:#ec835a;
  --brand:#0b7f5e; --hg1:#0a3d30; --hg2:#0f7a5c; --hglow:#34d3a0;
  --brand-t:color-mix(in srgb,var(--brand) 62%,var(--ink));
  --brand-soft:color-mix(in srgb,var(--brand) 13%,var(--surface));
  --btn:var(--brand); --btn-ink:#fff; --shade:rgba(8,14,11,.5); --glass:rgba(251,252,250,.84); --tbg:#17211c; --tink:#f2f6f3;
  --shadow:0 1px 2px rgba(14,26,21,.06),0 12px 30px rgba(14,26,21,.10);
  --shadow-s:0 1px 2px rgba(14,26,21,.04),0 6px 18px rgba(14,26,21,.05);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-brand="samudra"]{--brand:#2f4fd0;--hg1:#101f5c;--hg2:#2a46c0;--hglow:#7aa2ff}
:root[data-brand="anggur"]{--brand:#6a40d4;--hg1:#2a1260;--hg2:#5a35c0;--hglow:#b79bff}
:root[data-brand="mawar"]{--brand:#c23868;--hg1:#5a1030;--hg2:#b02e5c;--hglow:#ff8fb1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c120f; --surface:#141b18; --surface2:#1b2420; --ink:#edf2ee; --ink2:#b9c4bd; --mute:#8b9992;
  --line:#25302b; --axis:#34413b; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --track3:#1d3a30; --track2:#3a2a22; --track1:#1c2f48;
  --pos:#2dc22d; --shade:rgba(0,0,0,.64); --glass:rgba(20,27,24,.8);
  --shadow:0 14px 34px rgba(0,0,0,.5); --shadow-s:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c120f; --surface:#141b18; --surface2:#1b2420; --ink:#edf2ee; --ink2:#b9c4bd; --mute:#8b9992;
  --line:#25302b; --axis:#34413b; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --track3:#1d3a30; --track2:#3a2a22; --track1:#1c2f48;
  --pos:#2dc22d; --shade:rgba(0,0,0,.64); --glass:rgba(20,27,24,.8);
  --shadow:0 14px 34px rgba(0,0,0,.5); --shadow-s:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(900px 420px at 92% -140px,color-mix(in srgb,var(--brand) 17%,transparent),transparent 72%),var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:1040px;margin:0 auto;padding-block:10px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}.r{text-align:right}
.tn{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes rise{from{transform:translateY(10px);opacity:.55}to{transform:none;opacity:1}}
@keyframes slideup{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translate(-50%,12px) scale(.96);opacity:0}to{transform:translate(-50%,0);opacity:1}}
main>section:not([hidden]) .grid>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
main>section:not([hidden]) .grid>:nth-child(2){animation-delay:.05s}
main>section:not([hidden]) .grid>:nth-child(3){animation-delay:.1s}
main>section:not([hidden]) .grid>:nth-child(4){animation-delay:.15s}
main>section:not([hidden]) .grid>:nth-child(n+5){animation-delay:.2s}

/* Bagian atas */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(145deg,var(--hg2),var(--hg1));box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.avatar .ic{width:22px;height:22px}
.hi{display:flex;flex-direction:column;min-width:0}
.hi b{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi small{color:var(--mute);font-size:12px;display:flex;flex-wrap:wrap;align-items:center;gap:0 8px}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.stat i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.stat[data-m=db] i{background:var(--pos)}.stat[data-m=local] i{background:var(--warn)}.stat[data-m=mem] i{background:var(--crit)}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow-s);flex:none}
.ib[aria-current=page]{background:var(--brand);border-color:var(--brand);color:#fff}
.ib:active{transform:scale(.94)}
.mbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mbar h1{flex:1;min-width:0;font-size:clamp(26px,7vw,34px);line-height:1.08;font-weight:800;letter-spacing:-.04em;text-wrap:balance}
.step{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-s)}
.step button{width:42px;height:42px;display:grid;place-items:center}
.step button+button{border-left:1px solid var(--line)}
.step button:active{background:var(--surface2)}
.now{font-size:12px;font-weight:700;padding:8px 13px;border-radius:999px;background:var(--brand-soft);color:var(--brand-t)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 16px;margin-bottom:14px;border-radius:18px;background:var(--brand-soft);border:1px dashed color-mix(in srgb,var(--brand) 40%,var(--line));font-size:13px}
.banner p{flex:1 1 220px;min-width:0;color:var(--ink2)}.banner b{color:var(--ink)}

/* Kartu dan grid */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0;box-shadow:var(--shadow-s)}
.card>h2,.ch{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.ch small{font-weight:500;color:var(--mute);font-size:12px}
.empty{padding:18px 8px;text-align:center;color:var(--mute);font-size:13px;display:grid;gap:10px;justify-items:center}
.art{width:68px;height:68px;border-radius:24px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-t);margin-bottom:2px}
.art .ic{width:30px;height:30px;stroke-width:1.7}

/* Kartu aset */
.hero{position:relative;overflow:hidden;isolation:isolate;color:#fff;border:0;border-radius:28px;padding:22px 20px;display:grid;gap:16px;box-shadow:0 18px 40px color-mix(in srgb,var(--hg1) 40%,transparent);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--hglow) 38%,transparent),transparent 58%),linear-gradient(145deg,var(--hg1),var(--hg2))}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.13);z-index:-1;pointer-events:none}
.hero::before{width:250px;height:250px;right:-60px;top:-96px}
.hero::after{width:420px;height:420px;right:-170px;top:-150px;border-color:rgba(255,255,255,.07)}
.hero .lab{color:rgba(255,255,255,.76)}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.chip-d{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip-d .ic{width:14px;height:14px;stroke-width:2.4}
.chip-d[data-s=up]{background:rgba(120,255,190,.22)}.chip-d[data-s=down]{background:rgba(255,150,120,.26)}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:clamp(38px,10.6vw,68px);font-weight:800;letter-spacing:-.045em;line-height:1}
.big small{font-size:.36em;font-weight:700;letter-spacing:0;color:rgba(255,255,255,.72)}
.spark{height:64px;min-width:0}.spark svg{display:block}
.split{display:grid;gap:10px}
.sbar{display:flex;gap:3px;height:8px}.sbar i{display:block;border-radius:4px;background:#fff;min-width:6px}.sbar i+i{opacity:.4}
.hsplit{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13px;color:rgba(255,255,255,.78)}
.hsplit b{color:#fff;font-weight:700;margin-left:6px}
.hsplit i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:#fff}
.hsplit span+span i{opacity:.4}

/* Ringkasan angka */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis .kpi:first-child{grid-column:1/-1}
@media(min-width:620px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis .kpi:first-child{grid-column:auto}}
.kpi{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 11%,var(--surface)),var(--surface) 62%);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:6px;min-width:0;box-shadow:var(--shadow-s)}
.kh{display:flex;align-items:center;gap:10px}
.kic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--ink));flex:none}
.kic .ic{width:18px;height:18px;stroke-width:2.2}
.kpi .v{font-size:clamp(16px,4.8vw,24px);font-weight:800;letter-spacing:-.035em;line-height:1.15;overflow-wrap:anywhere}
.kpis .kpi:first-child .v{font-size:clamp(22px,6.4vw,30px)}
@media(min-width:620px){.kpis .kpi .v,.kpis .kpi:first-child .v{font-size:clamp(20px,2.6vw,28px)}}
.kpi .d{font-size:12px;color:var(--mute)}
.ins{display:grid;gap:0}
.ins>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ins>div:first-child{padding-top:0}.ins>div:last-child{border-bottom:0;padding-bottom:0}
.ins dt{color:var(--ink2);font-size:13px}.ins dd{margin:0;font-weight:700;text-align:right}
.ins .h{grid-column:1/-1;font-size:12px;font-weight:400;text-align:left;color:var(--mute)}
.gl{display:grid;gap:14px}
.grow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;width:100%;text-align:left;padding:2px 0}
.grow:active{opacity:.7}

/* Grafik dan daftar peringkat */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.flow{min-width:0}.flow svg{display:block;width:100%;height:auto;overflow:visible}
.flow .hit{cursor:pointer;outline:none}.flow .hit:focus-visible .bandr{stroke:var(--brand);stroke-width:2}
.rk{display:grid;gap:6px;margin-bottom:15px}.rk:last-child{margin-bottom:0}
.rk .t{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
.rk .nm{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink2)}
.rk .nm .ic{width:16px;height:16px;color:var(--mute)}
.rk .nm>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .note{color:var(--mute);font-size:12px;font-weight:500;white-space:nowrap}
.rk .val{font-weight:700;white-space:nowrap}
.rk .bar{height:10px;border-radius:0 5px 5px 0;background:var(--c);min-width:2px}
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
th:first-child,td:first-child{text-align:left;padding-left:0}th:last-child,td:last-child{padding-right:0}
tr[data-cur] td{font-weight:700;color:var(--brand-t)}
tr:last-child td{border-bottom:0}
.more{margin-top:10px;font-size:13px;font-weight:700;padding:8px 0;color:var(--brand-t);text-decoration:underline;text-underline-offset:3px}

/* Daftar transaksi */
.ctl{display:grid;gap:10px;margin-bottom:12px}
.ctl .r1{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:620px){.ctl .r1{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.sum{font-size:13px;color:var(--ink2);margin-bottom:4px}.sum b{color:var(--ink)}
.grp h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:18px 0 2px}
.grp h3 .tn{text-transform:none;letter-spacing:0;font-weight:600}
.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.tx:hover .n{text-decoration:underline;text-underline-offset:3px}
.ti{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--ink));flex:none}
.ti .ic{width:19px;height:19px;stroke-width:2}
.tx .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tx .a.in{color:var(--pos)}.tx .a.nt{color:var(--ink2)}
.tx>div{min-width:0}

/* Target tabungan dan anggaran */
.meter{height:10px;border-radius:99px;background:var(--tr,var(--surface2));overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--fill,var(--ink2));transition:width .35s}
.goal{display:grid;gap:14px}
.gtop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.gi{display:grid;gap:5px;min-width:0}.gi b{font-size:16px;overflow-wrap:anywhere}
.gn{font-size:13px;color:var(--ink2);display:grid;gap:3px}
.ring{display:block;flex:none}
.ring .trk{fill:none;stroke:color-mix(in srgb,var(--c,var(--brand)) 16%,var(--surface2))}
.ring .prg{fill:none;stroke:var(--c,var(--brand));stroke-linecap:round}
.ring text{fill:var(--ink)}
.sumrow{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.sumrow>div{min-width:0;flex:1 1 150px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill[data-s=warn]{background:color-mix(in srgb,var(--warn) 22%,var(--surface))}
.pill[data-s=crit]{background:color-mix(in srgb,var(--crit) 16%,var(--surface))}
.pill[data-s=ok]{background:color-mix(in srgb,var(--s3) 18%,var(--surface))}
.pill .ic{width:14px;height:14px;stroke-width:2.4}
.pill[data-s=warn] .ic{color:#b07a00}.pill[data-s=crit] .ic{color:var(--crit)}.pill[data-s=ok] .ic{color:var(--pos)}
.brow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.brow:last-child{border-bottom:0}
.bb{display:grid;gap:8px;min-width:0}
.bb .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bb .t b{font-size:14px}.bb .t span{font-size:13px;color:var(--ink2)}
.bb .f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.set{display:grid;gap:0}.set .li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.set .li:last-child{border-bottom:0}.set .li>div{min-width:0}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px}
.th{display:grid;gap:8px;justify-items:center;padding:12px 6px;border-radius:16px;border:2px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2);text-align:center}
.th i{width:42px;height:42px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.th[aria-pressed=true]{border-color:var(--brand);color:var(--ink);background:var(--brand-soft)}

/* Formulir */
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>span,.fl{font-size:12px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=date],input[type=search],select{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
input[type=text]:focus,input[type=date]:focus,input[type=search]:focus,select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
input::placeholder{color:var(--mute)}
.amt{--c:var(--brand);display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:18px;background:color-mix(in srgb,var(--c) 8%,var(--surface2));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));margin-bottom:10px}
.amt span{font-weight:700;color:var(--mute);font-size:18px}

<script>
'use strict';
/* ===== Konstanta ===== */
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const CO=[['makan','Makan & minum'],['transport','Transportasi'],['belanja','Belanja'],['tagihan','Tagihan & pulsa'],['rumah','Rumah & kos'],['hiburan','Hiburan'],['sehat','Kesehatan'],['didik','Pendidikan'],['cicilan','Cicilan & utang'],['sosial','Sosial & donasi'],['lain','Lainnya']];
const CI=[['gaji','Gaji'],['bonus','Bonus & THR'],['usaha','Usaha sampingan'],['hadiah','Hadiah'],['invest','Hasil investasi'],['lain_in','Lainnya']];
const CN={};CO.concat(CI).forEach(([k,v])=>CN[k]=v);
const KINDS=[['tunai','Tunai'],['bank','Rekening bank'],['ewallet','E-wallet'],['tabungan','Tabungan / deposito'],['invest','Investasi'],['lain','Lainnya']];
const KN={in:'Pemasukan',out:'Pengeluaran',sv:'Setor tabungan',wd:'Tarik tabungan',tf:'Transfer'};
const BRANDS=[['zamrud','Zamrud','#0a3d30','#0f7a5c'],['samudra','Samudra','#101f5c','#2a46c0'],['anggur','Anggur','#2a1260','#5a35c0'],['mawar','Mawar','#5a1030','#b02e5c']];
const CICON={makan:'utensils',transport:'car',belanja:'bag',tagihan:'zap',rumah:'home',hiburan:'ticket',sehat:'activity',didik:'book',cicilan:'card',sosial:'heart',lain:'dots',gaji:'briefcase',bonus:'gift',usaha:'store',hadiah:'gift',invest:'trend',lain_in:'dots'};
const KICON={tunai:'banknote',bank:'bank',ewallet:'phone',tabungan:'piggy',invest:'trend',lain:'wallet'};

/* ===== Utilitas ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayS=()=>dstr(new Date());
const ymOf=d=>String(d).slice(0,7);
const addM=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)};
const monthEnd=ym=>ym+'-'+pad(new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate());
const daysIn=ym=>+monthEnd(ym).slice(8);
const mLabel=ym=>MN[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const mShort=ym=>MS[+ym.slice(5,7)-1];
const mDiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const dLabel=d=>{const y=+d.slice(0,4),m=+d.slice(5,7),dd=+d.slice(8,10);return DN[new Date(y,m-1,dd).getDay()]+', '+dd+' '+MS[m-1]+(y!==new Date().getFullYear()?' '+y:'')};
const num=n=>String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const rp=n=>(n<0?'−':'')+'Rp '+num(n);   // spasi tak terputus: "Rp" tidak pernah terpisah dari angkanya
const dShort=d=>{const y=+d.slice(0,4),m=+d.slice(5,7),dd=+d.slice(8,10);return dd+' '+MS[m-1]+(y!==new Date().getFullYear()?' '+y:'')};
const cmp=n=>{const a=Math.abs(n),s=n<0?'−':'';const f=(v,u)=>{const r=Math.round(v*10)/10;return s+(Number.isInteger(r)||r>=100?String(Math.round(r)):String(r).replace('.',','))+' '+u};
  if(a>=1e9)return f(a/1e9,'M');if(a>=1e6)return f(a/1e6,'jt');if(a>=1e3)return f(a/1e3,'rb');return s+Math.round(a)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ico=n=>'<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const dLong=d=>{const y=+d.slice(0,4),m=+d.slice(5,7),dd=+d.slice(8,10);return DN[new Date(y,m-1,dd).getDay()]+', '+dd+' '+MN[m-1]+' '+y};
const greet=()=>{const h=new Date().getHours();return h<4?'Selamat malam':h<11?'Selamat pagi':h<15?'Selamat siang':h<19?'Selamat sore':'Selamat malam'};

/* ===== Keadaan aplikasi ===== */
const TODAY=todayS(),NOW=ymOf(TODAY);
let S=null,DEMO=true,CUR=NOW,VIEW='ringkasan',MODE='load',CONFIRMED=false,DL=null,RECAP12=false;
let TF={q:'',k:'all',c:'',all:false};
const brand0=()=>{try{const b=localStorage.getItem('kas:brand');return BRANDS.some(r=>r[0]===b)?b:'zamrud'}catch(e){return'zamrud'}};
const blank=()=>({name:'',brand:brand0(),accounts:[{id:'a1',name:'Tunai',kind:'tunai',open:0},{id:'a2',name:'Rekening bank',kind:'bank',open:0},{id:'a3',name:'E-wallet',kind:'ewallet',open:0}],goals:[],budgets:{},tx:[]});
// Data dari penyimpanan akun datang sebagai objek beku (tidak bisa diubah). Salin dalam-dalam
// supaya S selalu berupa data biasa yang boleh diubah: tambah/ubah dompet, target, anggaran, transaksi.
function norm(x){const b=blank(),o=Object.assign(b,x?JSON.parse(JSON.stringify(x)):{});
  if(!BRANDS.some(r=>r[0]===o.brand))o.brand=brand0();
  if(!Array.isArray(o.accounts)||!o.accounts.length)o.accounts=blank().accounts;
  if(!Array.isArray(o.goals))o.goals=[];if(!o.budgets||typeof o.budgets!=='object'||Array.isArray(o.budgets))o.budgets={};
  o.tx=Array.isArray(o.tx)?o.tx.filter(t=>t&&typeof t.d==='string'&&t.d.length===10&&t.a>0):[];o.name=String(o.name||'');return o}
const accOf=id=>S.accounts.find(a=>a.id===id);
const goalOf=id=>S.goals.find(g=>g.id===id);
const accName=id=>{const a=accOf(id);return a?a.name:'(dihapus)'};
const sortTx=l=>l.slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.t||0)-(a.t||0));

/* ===== Perhitungan ===== */
// Saldo tiap dompet dan tiap target tabungan sampai tanggal 'cut' (termasuk).
function balances(cut='9999-12-31'){
  const b={},g={};S.accounts.forEach(a=>b[a.id]=+a.open||0);S.goals.forEach(x=>g[x.id]=+x.start||0);
  const add=(o,k,v)=>{if(o[k]!=null)o[k]+=v};
  for(const t of S.tx){if(t.d>cut)continue;const a=t.a;
    if(t.k==='in')add(b,t.w,a);else if(t.k==='out')add(b,t.w,-a);
    else if(t.k==='sv'){add(b,t.w,-a);add(g,t.g,a)}else if(t.k==='wd'){add(b,t.w,a);add(g,t.g,-a)}
    else if(t.k==='tf'){add(b,t.w,-a);add(b,t.to,a)}}
  const sum=o=>Object.keys(o).reduce((s,k)=>s+o[k],0),accTot=sum(b),goalTot=sum(g);
  return{b,g,accTot,goalTot,total:accTot+goalTot}}
function stats(ym){const r={inc:0,out:0,sv:0,wd:0,cat:{},n:0};
  for(const t of S.tx){if(t.d.slice(0,7)!==ym)continue;r.n++;
    if(t.k==='in')r.inc+=t.a;else if(t.k==='out'){r.out+=t.a;r.cat[t.c]=(r.cat[t.c]||0)+t.a}
    else if(t.k==='sv')r.sv+=t.a;else if(t.k==='wd')r.wd+=t.a}
  r.save=r.sv-r.wd;return r}
function firstYM(){let m=null;for(const t of S.tx){const y=t.d.slice(0,7);if(!m||y<m)m=y}return m||NOW}
// Rata-rata pengeluaran per bulan: pakai bulan penuh sebelumnya; kalau belum ada, pakai bulan berjalan.
function avgOut(ym,n=3){let s=0,c=0;for(let i=1;i<=n;i++){const o=stats(addM(ym,-i)).out;if(o>0){s+=o;c++}}
  if(!c){const o=stats(ym).out;if(o>0)return o}return c?s/c:0}
function goalInfo(g){const bal=balances().g[g.id]||0,need=Math.max(0,g.target-bal);
  const from=dstr(new Date(Date.now()-90*864e5));let net=0;
  for(const t of S.tx){if(t.g!==g.id||t.d<from)continue;net+=t.k==='sv'?t.a:t.k==='wd'?-t.a:0}
  const pace=Math.max(0,net/3);let perMonth=null,left=null;
  if(g.due&&need>0){left=Math.max(1,mDiff(NOW,ymOf(g.due)));perMonth=need/left}
  let eta=null;if(need>0&&pace>0){const m=Math.ceil(need/pace);eta=m>120?'lebih dari 10 tahun lagi':mLabel(addM(NOW,m))}
  return{bal,need,done:need===0&&g.target>0,pace,perMonth,left,eta,p:Math.min(100,pct(bal,g.target))}}

/* ===== Data contoh (hanya tampil sebelum pengguna mulai) ===== */
function demo(){
  const rnd=(a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(7);
  const pick=l=>l[Math.floor(rnd()*l.length)],rr=(lo,hi,st=1000)=>Math.round((lo+rnd()*(hi-lo))/st)*st;
  const s={name:'',brand:brand0(),accounts:[{id:'a1',name:'Tunai',kind:'tunai',open:450000},{id:'a2',name:'Rekening bank',kind:'bank',open:6200000},{id:'a3',name:'E-wallet',kind:'ewallet',open:230000}],
    goals:[{id:'g1',name:'Dana darurat',target:30000000,due:'',start:6000000},{id:'g2',name:'Liburan akhir tahun',target:8000000,due:addM(NOW,4)+'-15',start:0},{id:'g3',name:'Laptop baru',target:12000000,due:'',start:1500000}],
    budgets:{makan:1500000,transport:500000,hiburan:300000,belanja:700000,tagihan:600000},tx:[]};
  let n=0;const add=(d,k,a,o)=>{if(d>TODAY)return;n++;s.tx.push(Object.assign({id:'d'+n,d,k,a,t:n},o))};
  for(let i=-5;i<=0;i++){const m=addM(NOW,i),D=x=>m+'-'+pad(x);
    add(D(1),'in',8500000+(i%2===0?250000:0),{c:'gaji',w:'a2',n:'Gaji bulanan'});
    if(i%3===0)add(D(12),'in',rr(600000,1400000,50000),{c:'usaha',w:'a2',n:'Proyek desain'});
    add(D(1),'out',1500000,{c:'rumah',w:'a2',n:'Sewa kos'});
    add(D(5),'out',rr(180000,260000,5000),{c:'tagihan',w:'a2',n:'Token listrik'});
    add(D(7),'out',350000,{c:'tagihan',w:'a2',n:'Internet'});
    add(D(2),'sv',1000000,{g:'g1',w:'a2',n:'Setoran dana darurat'});
    if(i%2===0)add(D(3),'sv',500000,{g:'g2',w:'a2',n:'Nabung liburan'});
    add(D(2),'tf',2000000,{w:'a2',to:'a3',n:'Isi saldo e-wallet'});
    add(D(3),'tf',500000,{w:'a2',to:'a1',n:'Tarik tunai'});
    for(let d=1;d<=daysIn(m);d++){
      if(rnd()<0.62)add(D(d),'out',rr(18000,48000,1000),{c:'makan',w:pick(['a1','a3']),n:pick(['Makan siang','Nasi padang','Ayam geprek','Warteg','Bakso'])});
      if(rnd()<0.5)add(D(d),'out',rr(40000,90000,1000),{c:'makan',w:'a3',n:pick(['Makan malam','Pesan antar','Sate'])});
      if(rnd()<0.22)add(D(d),'out',rr(15000,35000,1000),{c:'makan',w:'a3',n:'Kopi'});
      if(rnd()<0.35)add(D(d),'out',rr(10000,40000,1000),{c:'transport',w:'a3',n:pick(['Ojek online','KRL','Parkir'])})}
    if(rnd()<0.85)add(D(15),'out',rr(450000,750000,10000),{c:'belanja',w:'a2',n:'Belanja bulanan'});
    if(rnd()<0.6)add(D(20),'out',rr(60000,150000,5000),{c:'hiburan',w:'a3',n:'Nonton dan jajan'});
    if(rnd()<0.4)add(D(18),'out',rr(80000,220000,5000),{c:'sehat',w:'a1',n:'Apotek'})}
  return s}

/* ===== Penyimpanan versi aplikasi =====
   Tiap akun punya catatan sendiri di perangkat ini (localStorage). Akun boleh dikunci PIN 6 angka:
   isinya lalu dienkripsi (AES-GCM, kunci dari PBKDF2) dan hanya terbuka dengan PIN itu.
   Tidak ada server: tidak ada data yang dikirim ke mana pun. */
const K_IDX='kas2:index',K_REC='kas2:d:',PIN_LEN=6,KDF_ITER=200000;
let IDX={v:2,last:null,accounts:[]},CTX=null,saveQ=Promise.resolve(),PEND_DATA=null;
const CRYPTO_OK=!!(window.crypto&&crypto.subtle);
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=u=>{const a=new Uint8Array(u);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const packOf=s=>({app:'buku-kas-saku',v:1,settings:{name:s.name,brand:s.brand,accounts:s.accounts,goals:s.goals,budgets:s.budgets},tx:s.tx});
const pack=()=>packOf(S);
const clean=o=>JSON.parse(JSON.stringify(o));
function unpack(j){if(!j||typeof j!=='object')return null;const st=j.settings;
  if(!st||!Array.isArray(st.accounts)||!Array.isArray(j.tx))return null;return norm(Object.assign({},st,{tx:j.tx}))}
const lsr=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsw=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const lsd=k=>{try{localStorage.removeItem(k)}catch(e){}};
function lsProbe(){try{localStorage.setItem('_p','1');localStorage.removeItem('_p');return true}catch(e){return false}}
const recOf=id=>{const r=lsr(K_REC+id);try{return r?JSON.parse(r):null}catch(e){return null}};

/* --- daftar akun (tidak rahasia: nama, tema, ada-tidaknya PIN) --- */
function idxLoad(){let j=null;try{j=JSON.parse(lsr(K_IDX)||'null')}catch(e){}
  IDX=j&&Array.isArray(j.accounts)?{v:2,last:j.last||null,accounts:j.accounts.filter(a=>a&&typeof a.id==='string'&&typeof a.name==='string')}:{v:2,last:null,accounts:[]}}
const idxSave=()=>lsw(K_IDX,JSON.stringify(IDX));
const acctOf=id=>IDX.accounts.find(a=>a.id===id);
const curAcct=()=>CTX?acctOf(CTX.id):null;

/* --- status --- */
function statusInfo(){
  if(MODE==='load')return['load','Memuat…'];
  if(MODE==='mem')return['mem','Belum tersimpan'];
  if(DEMO||!CTX)return['local','Data contoh'];
  const a=curAcct();return['db',a&&a.pin?'Terkunci PIN · di perangkat ini':'Tersimpan di perangkat ini']}
function updateStatus(){const s=$('#stat'),[m,t]=statusInfo();s.dataset.m=m;s.lastElementChild.textContent=t}
function storeNote(){
  if(MODE==='mem')return'Penyimpanan browser sedang diblokir (mungkin mode pribadi), jadi catatan tidak bisa disimpan. Izinkan penyimpanan situs, lalu muat ulang.';
  const a=curAcct();
  return'Catatan ini hanya ada di perangkat ini dan tidak dikirim ke server mana pun. '+(a&&a.pin?'Isinya dienkripsi dengan PIN-mu. ':'')+'Supaya aman kalau perangkat hilang atau diganti, unduh cadangan secara berkala.'}
function guard(){if(MODE==='load'){toast('Sebentar, masih memuat.');return false}return true}

/* --- enkripsi --- */
async function deriveKey(pin,salt,iter){
  const km=await crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,salt,iter,text){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(text));
  return JSON.stringify({v:2,e:1,s:b64(salt),i:iter,iv:b64(iv),ct:b64(ct)})}
async function unseal(key,rec){return TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},key,unb64(rec.ct)))}
async function writeRec(ctx,text){
  const s=ctx.key?await seal(ctx.key,ctx.salt,ctx.iter,text):'{"v":2,"e":0,"d":'+text+'}';
  if(!lsw(K_REC+ctx.id,s))throw{code:'quota_exceeded'}}

/* --- menyimpan: teks catatan disalin saat dipanggil, penulisan berjalan berurutan --- */
function enq(fn){saveQ=saveQ.then(fn).catch(onSaveErr);return saveQ}
function onSaveErr(e){console.error('Gagal menyimpan',e);
  toast(e&&e.code==='quota_exceeded'?'Penyimpanan perangkat penuh atau ditolak. Unduh cadangan sekarang.':'Gagal menyimpan. Unduh cadangan sekarang, lalu muat ulang halaman.')}
const snap=()=>JSON.stringify(pack());
function syncIdx(){const a=curAcct();if(!a)return;let ch=false;const nm=(S.name||'').trim();
  if(nm&&a.name!==nm){a.name=nm;ch=true}if(a.brand!==S.brand){a.brand=S.brand;ch=true}if(ch)idxSave()}
function persist(){
  if(DEMO||!CTX||!S)return;
  const ctx=CTX,text=snap();syncIdx();
  enq(()=>writeRec(ctx,text));updateStatus()}
function replaceAll(ns){if(!CTX){PEND_DATA=ns;appStart();return}S=ns;DEMO=false;persist()}

/* --- membuka akun. Hasil: 'ok' | 'pin' (perlu atau salah PIN) | 'bad' (data rusak) | 'none' --- */
async function openAccount(id,pin){
  const rec=recOf(id),a=acctOf(id);if(!rec||!a)return'none';
  let text,key=null,salt=null;
  if(rec.e===1){
    if(!CRYPTO_OK)return'bad';if(pin==null)return'pin';
    try{salt=unb64(rec.s);key=await deriveKey(pin,salt,rec.i||KDF_ITER);text=await unseal(key,rec)}catch(e){return'pin'}
  }else text=JSON.stringify(rec.d);
  let ns=null;try{ns=unpack(JSON.parse(text))}catch(e){}
  if(!ns)return'bad';
  CTX={id,key,salt,iter:rec.i||KDF_ITER};S=ns;DEMO=false;
  a.pin=rec.e===1;IDX.last=id;idxSave();return'ok'}
function afterOpen(){
  hideLock();CUR=NOW;render();
  if(location.hash==='#catat'){try{history.replaceState(null,'','#ringkasan')}catch(e){}setTimeout(()=>{if(S&&!DEMO)openTx(null,'out')},250)}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}}

/* --- membuat akun baru; ns = data awal (kosong atau dari cadangan) --- */
async function makeAccount(name,pin,ns){
  const id=uid();let key=null,salt=null;
  if(pin){salt=crypto.getRandomValues(new Uint8Array(16));key=await deriveKey(pin,salt,KDF_ITER)}
  ns.name=name;const ctx={id,key,salt,iter:KDF_ITER};
  try{await writeRec(ctx,JSON.stringify(packOf(ns)))}catch(e){lsd(K_REC+id);return false}
  IDX.accounts.push({id,name,brand:ns.brand,pin:!!pin,at:Date.now(),bk:0});IDX.last=id;
  if(!idxSave()){lsd(K_REC+id);idxLoad();return false}
  CTX=ctx;S=ns;DEMO=false;PEND_DATA=null;return true}

/* --- PIN: pasang, ganti (newPin = 6 angka) atau hapus (newPin = null). Berjalan di antrean penyimpanan. --- */
async function verifyPin(pin){
  const rec=CTX&&recOf(CTX.id);if(!rec||rec.e!==1)return true;
  try{await unseal(await deriveKey(pin,unb64(rec.s),rec.i||KDF_ITER),rec);return true}catch(e){return false}}
function changePin(newPin){
  const ctx=CTX;
  return new Promise(res=>{enq(async()=>{
    try{
      if(CTX!==ctx||!S)throw{code:'aborted'};
      const text=snap();
      if(newPin){
        const salt=crypto.getRandomValues(new Uint8Array(16)),key=await deriveKey(newPin,salt,KDF_ITER);
        if(!lsw(K_REC+ctx.id,await seal(key,salt,KDF_ITER,text)))throw{code:'quota_exceeded'};

      }else{
        if(!lsw(K_REC+ctx.id,'{"v":2,"e":0,"d":'+text+'}'))throw{code:'quota_exceeded'};
        ctx.key=null;ctx.salt=null}
      const a=acctOf(ctx.id);if(a){a.pin=!!newPin;idxSave()}
      res(true)
    }catch(e){res(false);throw e}})})}

  const rs=PEND_DATA,ns=rs?norm(rs):norm(blank());
  if(!rs){$$('#sheet [data-o]').forEach(i=>{ns.accounts[+i.dataset.o].open=parseInt(i.value.replace(/\D/g,''),10)||0});if(S&&S.brand)ns.brand=S.brand}
  STARTING=true;const btn=$('#sheet [data-act=save-acct]');if(btn){btn.disabled=true;btn.textContent='Menyiapkan…'}
  let ok=false;try{ok=await makeAccount(name,pin,ns)}catch(e){console.error(e)}
  STARTING=false;
  if(!ok){if(btn){btn.disabled=false;btn.textContent='Coba lagi'}return formErr('Akun belum bisa dibuat karena penyimpanan browser menolak. Izinkan penyimpanan situs, lalu coba lagi.')}
  closeSheet();afterOpen();toast(rs?'Cadangan dipulihkan ke akun '+name:'Akun siap. Tekan + untuk mencatat transaksi pertama.',null,'sparkle')}

/* --- pengaturan akun, PIN --- */
function acctCard(){
  const a=curAcct();if(!a||DEMO)return'';
  return'<section class="card span2"><div class="ch">Akun<small>di perangkat ini</small></div>'
  +'<div class="acr"><span class="lk-av" style="'+avStyle(a)+'">'+initial(a)+'</span><div style="min-width:0"><b>'+esc(a.name)+'</b><div class="xs mute">'+(a.pin?'Dikunci PIN, catatan terenkripsi':'Tanpa PIN')+' · '+IDX.accounts.length+' akun di perangkat ini</div></div></div>'
  +'<div class="set">'
  +'<div class="li"><div><b>Ganti akun</b><div class="xs mute">Beralih ke akun lain atau buat akun baru. Catatan tiap akun terpisah.</div></div><button class="btn sm sec" data-act="lk-list">'+ico('users')+'Ganti</button></div>'
  +(a.pin?'<div class="li"><div><b>Kunci sekarang</b><div class="xs mute">Aplikasi juga terkunci sendiri setelah ditinggalkan 2 menit.</div></div><button class="btn sm sec" data-act="lock-now">'+ico('lock')+'Kunci</button></div>':'')
  +'<div class="li"><div><b>PIN</b><div class="xs mute">'+(a.pin?'Aktif. Mengganti atau menghapus PIN butuh PIN saat ini.':'Belum dipasang. Pasang agar orang lain yang memakai perangkat ini tidak bisa membuka catatanmu.')+'</div></div><div style="display:flex;gap:8px;flex:none">'
    +(a.pin?'<button class="btn sm sec" data-act="pin-form" data-v="change">Ganti</button><button class="btn sm out" data-act="pin-form" data-v="remove">Hapus</button>':'<button class="btn sm sec" data-act="pin-form" data-v="set">'+ico('lock')+'Pasang</button>')+'</div></div>'
  +'<div class="li"><div><b>Hapus akun ini</b><div class="xs mute">Menghapus akun beserta seluruh catatannya dari perangkat ini. Tidak bisa dibatalkan.</div></div><button class="btn sm out" data-act="acct-del">Hapus</button></div>'
  +'</div></section>'}
function pinForm(mode){
  const a=curAcct();if(!a||!CRYPTO_OK)return;F={pinMode:mode};
  const cur='<label class="fld"><span>PIN saat ini</span><input type="password" class="pin-in" id="p-cur" inputmode="numeric" pattern="[0-9]*" maxlength="'+PIN_LEN+'" autocomplete="current-password" placeholder="••••••"></label>';
  openSheet(mode==='set'?'Pasang PIN':mode==='change'?'Ganti PIN':'Hapus PIN','<div id="f-err"></div>'+(mode==='set'?'':cur)
    +(mode==='remove'?'<p class="sm mute" style="margin-bottom:14px">Setelah PIN dihapus, catatan akun ini tidak lagi dienkripsi dan bisa dibuka tanpa PIN.</p>':pinFields('p'))
    +'<div class="fa"><button type="button" class="btn" data-act="save-pin">'+(mode==='remove'?'Hapus PIN':'Simpan PIN')+'</button><button type="button" class="btn sec" data-act="close">Batal</button></div>')}
async function savePin(){
  if(!F||!F.pinMode||PINBUSY)return;const mode=F.pinMode;
  if(mode!=='set'&&!PINRE.test($('#p-cur').value))return formErr('Isi PIN saat ini ('+PIN_LEN+' angka).');
  let np=null;
  if(mode!=='remove'){np=$('#p-pin').value;if(!PINRE.test(np))return formErr('PIN baru harus '+PIN_LEN+' angka.');if(np!==$('#p-pin2').value)return formErr('Kedua PIN belum sama.')}
  PINBUSY=true;const btn=$('#sheet [data-act=save-pin]');if(btn)btn.disabled=true;
  try{
    if(mode!=='set'&&!await verifyPin($('#p-cur').value))return formErr('PIN saat ini salah.');
    if(!await changePin(np))return formErr('PIN belum bisa diubah. Coba lagi.');
    closeSheet();render();toast(mode==='remove'?'PIN dihapus':mode==='set'?'PIN terpasang. Catatan sekarang terenkripsi.':'PIN diganti',null,'check')
  }finally{PINBUSY=false;if(btn&&btn.isConnected)btn.disabled=false}}
function forgotPin(){
  const a=acctOf(LK.id);if(!a)return;
  openSheet('Lupa PIN?','<p class="sm" style="margin-bottom:14px">PIN tidak bisa dipulihkan karena catatan akun <b>'+esc(a.name)+'</b> dienkripsi dengan PIN itu. Ada dua pilihan:</p>'
    +'<div class="set"><div class="li"><div><b>Punya berkas cadangan?</b><div class="xs mute">Pulihkan ke akun baru. Akun lama bisa dihapus sesudahnya.</div></div><button class="btn sm sec" data-act="imp">'+ico('upload')+'Pilih berkas</button></div>'
    +'<div class="li"><div><b>Hapus akun '+esc(a.name)+'</b><div class="xs mute">Catatan akun ini dihapus dari perangkat. Tidak bisa dibatalkan.</div></div><button class="btn sm out" data-act="forgot-del" data-id="'+esc(a.id)+'">Hapus</button></div></div>')}
function openAcctMenu(){
  const a=curAcct();if(!a)return;
  openSheet('Akun','<div class="acr" style="margin-bottom:16px"><span class="lk-av" style="'+avStyle(a)+'">'+initial(a)+'</span><div style="min-width:0"><b>'+esc(a.name)+'</b><div class="xs mute">'+(a.pin?'Dikunci PIN':'Tanpa PIN')+'</div></div></div>'
    +'<div style="display:grid;gap:8px"><button type="button" class="btn sec" data-act="lk-list">'+ico('users')+'Ganti akun</button>'
    +(a.pin?'<button type="button" class="btn sec" data-act="lock-now">'+ico('lock')+'Kunci sekarang</button>':'')
    +'<button type="button" class="btn sec" data-act="menu-set">'+ico('gear')+'Pengaturan akun</button></div>')}

/* --- pasang di perangkat --- */
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installCard(){
  if(isStandalone())return'';
  const web=/^https?:$/.test(location.protocol);let body;
  if(!web)body='<p class="sm mute">Agar bisa dipasang sebagai aplikasi, berkas ini harus dibuka lewat alamat web (https). Lihat BACA-DULU.txt untuk caranya.</p>';
  else if(DEFER)body='<p class="sm mute" style="margin-bottom:12px">Pasang di layar utama supaya terbuka seperti aplikasi biasa dan tetap bisa dipakai tanpa internet.</p><button class="btn" data-act="install">'+ico('download')+'Pasang aplikasi</button>';
  else if(isIOS())body='<p class="sm mute">Di Safari: ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas), lalu pilih <b>Tambah ke Layar Utama</b>.</p>';
  else if(/Android/.test(navigator.userAgent))body='<p class="sm mute">Di Chrome: buka menu <b>⋮</b>, lalu pilih <b>Pasang aplikasi</b> atau <b>Tambahkan ke layar utama</b>.</p>';
  else body='<p class="sm mute">Di Chrome atau Edge: klik ikon pasang di ujung kolom alamat, atau buka menu <b>⋮</b> lalu pilih <b>Pasang Buku Kas Saku</b>.</p>';
  return'<section class="card"><div class="ch">Pasang di perangkat</div>'+body+'</section>'}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e;if(S&&!DEMO)drawBanner();
  const v=$('#v-pengaturan');if(VIEW==='pengaturan'&&S&&!(v&&v.contains(document.activeElement)))vSet()});
window.addEventListener('appinstalled',()=>{DEFER=null;toast('Aplikasi terpasang',null,'check');if(S&&!DEMO)drawBanner();if(VIEW==='pengaturan'&&S)vSet()});
async function doInstall(){if(!DEFER)return;const d=DEFER;DEFER=null;try{await d.prompt();await d.userChoice}catch(e){}if(S&&!DEMO)drawBanner();if(VIEW==='pengaturan'&&S)vSet()}

/* --- cadangan: unduh berkas (iPhone/iPad lewat lembar bagikan) --- */
async function appSave(name,text){
  try{
    const json=/\.json$/.test(name),type=json?'application/json':'text/csv;charset=utf-8',blob=new Blob([text],{type});
    if(isIOS()&&typeof File==='function'&&navigator.canShare&&navigator.share){
      const file=new File([blob],name,{type:json?'application/json':'text/csv'});
      if(navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:name})}catch(e){if(e&&e.name==='AbortError')return true;throw e}
        if(json)markBackup();toast('Cadangan dibagikan',null,'check');return true}}
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    if(json)markBackup();toast('Berkas diunduh. Simpan di tempat yang aman.',null,'check');return true
  }catch(e){console.error(e);return false}}
function markBackup(){const a=curAcct();if(!a)return;a.bk=Date.now();a.sn=0;idxSave();drawBanner();if(VIEW==='pengaturan'&&S)vSet()}
function backupNote(){const a=curAcct();if(!a||DEMO)return'';return a.bk?' Terakhir diunduh '+dShort(dstr(new Date(a.bk)))+'.':' Belum pernah diunduh.'}
function appBanner(){
  const a=curAcct();if(!a||!S)return'';const now=Date.now();
  if(!isStandalone()&&now>=(a.ni||0)){
    if(DEFER)return'<p><b>Pasang Buku Kas Saku di perangkat ini.</b> Terbuka seperti aplikasi biasa dan tetap bisa dipakai tanpa internet.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="install">Pasang</button><button class="btn sm sec" data-act="noinst">Nanti</button></div>';
    if(isIOS()&&/^https?:$/.test(location.protocol))return'<p><b>Pasang di Layar Utama:</b> ketuk tombol <b>Bagikan</b>, lalu pilih <b>Tambah ke Layar Utama</b>. Aplikasi terbuka layar penuh dan bisa dipakai tanpa internet.</p><div><button class="btn sm sec" data-act="noinst">Mengerti</button></div>'}
  if(S.tx.length<15||now-(a.bk||a.at||now)<30*864e5||now<(a.sn||0))return'';
  return'<p><b>Sudah lebih dari sebulan belum ada cadangan.</b> Catatanmu hanya ada di perangkat ini. Unduh cadangan supaya aman kalau perangkat hilang atau browser dibersihkan.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="exp-json">Unduh cadangan</button><button class="btn sm sec" data-act="snooze">Nanti</button></div>'}

/* --- siklus hidup --- */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  const a=curAcct(),away=hiddenAt?Date.now()-hiddenAt:0;hiddenAt=0;
  if(a&&a.pin&&CTX&&CTX.key&&away>AUTOLOCK_MS){lockApp(false);return}
  if(todayS()!==TODAY&&$('#scrim').hidden)location.reload()});   // ganti hari/bulan saat aplikasi dibiarkan terbuka
function appShell(){
  const a=$('#avatar');
  if(a&&a.tagName!=='BUTTON'){const b=document.createElement('button');b.type='button';b.id='avatar';b.className='avatar';b.dataset.act='acct-menu';b.setAttribute('aria-label','Akun');a.replaceWith(b)}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

/* --- aksi khusus aplikasi (dipanggil dari penangan klik bersama) --- */
function appAct(a,b,id,v){
  switch(a){
    case 'lk-pick':{const x=acctOf(id);if(!x)return true;
      const needPin=()=>{LK={mode:'pin',id,pin:'',busy:false,fails:LK.fails,until:LK.until,msg:'',bad:false};drawLock(false)};
      if(x.pin)needPin();
      else openAccount(id,null).then(r=>{if(r==='ok')afterOpen();else if(r==='pin'){x.pin=true;needPin()}else toast('Data akun ini tidak bisa dibuka.')});
      return true}
    case 'lk-d':lkDigit(v);return true;
    case 'lk-back':lkBack();return true;
    case 'lk-list':if(CTX)lockApp(true);else{LK.mode='pick';drawLock(true)}return true;
    case 'lk-new':appStart();return true;
    case 'lk-forgot':forgotPin();return true;
    case 'forgot-del':armed(b,'Ketuk lagi untuk menghapus',()=>{closeSheet();delAccount(id);afterDelete();toast('Akun dihapus')});return true;
    case 'lock-now':lockApp(false);return true;
    case 'acct-menu':if(DEMO)openStart();else openAcctMenu();return true;
    case 'menu-set':closeSheet();go('pengaturan');return true;
    case 'pinmode':PINMODE=+v;$$('#sheet [data-act=pinmode]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)));$('#o-pinbox').hidden=!PINMODE;return true;
    case 'save-acct':appStartGo();return true;
    case 'pin-form':pinForm(v);return true;
    case 'save-pin':savePin();return true;
    case 'acct-del':armed(b,'Ketuk lagi untuk menghapus akun ini',()=>{const x=curAcct();if(!x)return;const nm=x.name;delAccount(x.id);afterDelete();toast('Akun '+nm+' dihapus')});return true;
    case 'install':doInstall();return true;
    case 'noinst':{const x=curAcct();if(x){x.ni=Date.now()+30*864e5;idxSave();drawBanner()}return true}
    case 'snooze':{const x=curAcct();if(x){x.sn=Date.now()+7*864e5;idxSave();drawBanner()}return true}
    case 'imp-go':if(!CTX&&PENDING){PEND_DATA=PENDING;PENDING=null;appStart();return true}return false}
  return false}

/* ===== Peristiwa dan mulai ===== */
const money=el=>{const d=el.value.replace(/\D/g,'').slice(0,12);el.value=d?num(+d):'';return d?+d:0};
function armed(btn,label,fn){
  if(btn.dataset.armed){delete btn.dataset.armed;fn();return}
  const old=btn.textContent;btn.dataset.armed='1';btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=old}},3500)}
function quickGoal(id,k){
  if(DEMO){openStart();return}if(!guard())return;
  F={k,a:0,d:todayS(),n:'',w:null,to:null,g:null,c:null};fillDefaults(F);F.g=id;drawTxForm(false)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(e.target.id==='scrim')closeSheet();return}
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  try{
    if(typeof appAct==='function'&&appAct(a,b,id,v))return;   // aksi khusus versi aplikasi
    switch(a){
    case 'go':go(id);break;
    case 'mprev':setMonth(addM(CUR,-1));break;
    case 'mnext':setMonth(addM(CUR,1));break;
    case 'mnow':setMonth(NOW);break;
    case 'add':openTx(null,b.dataset.k);break;
    case 'edit':openTx(id);break;
    case 'start':openStart();break;
    case 'start-go':startGo();break;
    case 'close':closeSheet();break;
    case 'recap':RECAP12=!RECAP12;vRing();break;
    case 'tk':TF.k=id;
      if(id==='in'&&TF.c&&!CI.some(c=>c[0]===TF.c))TF.c='';
      else if(id==='out'&&TF.c&&!CO.some(c=>c[0]===TF.c))TF.c='';
      else if(id!=='all'&&id!=='in'&&id!=='out')TF.c='';
      vTrx();break;
    case 'kind':if(F)setKind(v);break;
    case 'svk':if(F){F.k=v;drawTxForm(!!F.id)}break;
    case 'pick':if(F){F.c=v;$$('#sheet [data-act=pick]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)))}break;
    case 'qa':if(F){F.a=(F.a||0)+(+v);$('#f-a').value=num(F.a)}break;
    case 'dt':if(F){const d=new Date();d.setDate(d.getDate()-(+v));F.d=dstr(d);$('#f-d').value=F.d}break;
    case 'save-tx':saveTx(!!b.dataset.again);break;
    case 'del-tx':armed(b,'Ketuk lagi untuk menghapus',delTx);break;
    case 'goal-new':openGoal(null);break;
    case 'goal-edit':openGoal(id);break;
    case 'goal-sv':quickGoal(id,'sv');break;
    case 'goal-wd':quickGoal(id,'wd');break;
    case 'save-goal':saveGoal();break;
    case 'del-goal':armed(b,'Ketuk lagi untuk menghapus',delGoal);break;
    case 'bud':openBud(id);break;
    case 'bfill':$('#b-l').value=num(+v);break;
    case 'save-bud':saveBud(false);break;
    case 'del-bud':saveBud(true);break;
    case 'acc-new':openAcc(null);break;
    case 'acc-edit':openAcc(id);break;
    case 'save-acc':saveAcc();break;
    case 'del-acc':armed(b,'Ketuk lagi untuk menghapus',delAcc);break;
    case 'brand':S.brand=id;applyBrand(id);persist({settings:true});render();break;
    case 'akind':if(F){F.kind=v;$$('#sheet [data-act=akind]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)))}break;
    case 'exp-csv':exportCSV();break;
    case 'exp-json':exportJSON();break;
    case 'imp':$('#impFile').click();break;
    case 'imp-go':if(PENDING&&guard()){replaceAll(PENDING);PENDING=null;closeSheet();render();toast('Cadangan dipulihkan')}break;
    case 'wipe':armed(b,'Ketuk lagi untuk menghapus semua',()=>{if(!guard())return;replaceAll(norm(blank()));render();toast('Semua catatan dihapus')});break;
    case 'copyx':{const t=$('#x-t');let p;try{p=navigator.clipboard.writeText(t.value)}catch(x){p=Promise.reject(x)}
      p.then(()=>toast('Tersalin')).catch(()=>{t.focus();t.select();toast('Pilih semua lalu salin manual')});break}
  }}catch(err){console.error(err);toast('Ada yang tidak berjalan. Muat ulang halaman lalu coba lagi.')}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('mny')){const n=money(t);if(t.dataset.f==='a'&&F)F.a=n;return}
  if(t.dataset&&t.dataset.f&&F){if(t.dataset.f==='n')F.n=t.value;else if(t.dataset.f==='d')F.d=t.value}
  if(t.dataset&&t.dataset.in==='q'){TF.q=t.value;drawTxList()}});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f,i=t.dataset&&t.dataset.in;
  if(f&&F){if(f==='w'||f==='to'||f==='g')F[f]=t.value;else if(f==='d')F.d=t.value;else if(f==='n')F.n=t.value}
  if(i==='c'){TF.c=t.value;drawTxList()}
  else if(i==='all'){TF.all=t.checked;drawTxList()}
  else if(i==='name'){if(!guard())return;S.name=t.value.trim().slice(0,24);persist({settings:true});drawHead()}
  if(t.id==='impFile'){const fl=t.files&&t.files[0];if(fl)readBackup(fl);t.value=''}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#scrim').hidden)closeSheet();else hideTip();return}
  if(e.key==='Enter'&&!$('#scrim').hidden&&e.target.matches&&e.target.matches('#sheet input:not([type=date])')){
    e.preventDefault();const s=$('#sheet [data-act^="save-"],#sheet [data-act="start-go"]');if(s)s.click()}});
window.addEventListener('hashchange',route);
(function(){const v=location.hash.slice(1);if(VIEWS.indexOf(v)>=0)VIEW=v})();
initStore();
</script>
